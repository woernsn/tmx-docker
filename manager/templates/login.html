{% extends "base.html" %}
{% block title %}Sign in · TMX administration{% endblock %}
{% block content %}
<section class="card narrow">
  <p class="eyebrow">Competition Factory server</p>
  <h1>Sign in</h1>
  <p>Use the administrator account created for the CF server.</p>
  {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Email <input type="email" name="email" autocomplete="username" required autofocus></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
