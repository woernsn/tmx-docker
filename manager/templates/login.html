{% extends "base.html" %}
{% block title %}Sign in · TMX administration{% endblock %}
{% block content %}
<section class="card narrow">
  <p class="eyebrow">Competition Factory server</p>
  <h1>Sign in</h1>
  <p>Use the administrator account created for the CF server.</p>
  {% if error %}<p class="notification is-danger is-light" role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label class="field"><span class="label">Email</span><input class="input" type="email" name="email" autocomplete="username" required autofocus></label>
    <label class="field"><span class="label">Password</span><input class="input" type="password" name="password" autocomplete="current-password" required></label>
    <button class="button is-primary" type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
