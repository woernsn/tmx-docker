map $request_method $auth_login_key {
  default "";
  POST $binary_remote_addr;
}
limit_req_zone $auth_login_key zone=auth_login:10m rate=10r/m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location = /tmx { return 302 /; }
  location ^~ /tmx/ { rewrite ^/tmx/(.*)$ /$1 redirect; }
  location = /pub { return 302 /pub/; }
  location = /manage { return 302 /manage/; }

  location = /manage/login {
    limit_req zone=auth_login burst=9 nodelay;
    limit_req_status 429;
    proxy_pass http://manager:8081/login;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /manage;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location ^~ /pub/ {
    proxy_pass http://pub/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /manage/ {
    proxy_pass http://manager:8081/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /manage;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location = /auth/tracker-token { proxy_pass http://server:8383; }
  location = /auth/scorer-token { proxy_pass http://server:8383; }
  location = /auth/provider-scoring-token { proxy_pass http://server:8383; }
  location ^~ /auth/sso/ { proxy_pass http://server:8383; }
  location ^~ /auth/hiveid/me/claimable/ { proxy_pass http://server:8383; }
  location = /auth/hiveid/me/claim { proxy_pass http://server:8383; }
  location = /internal/mint { return 404; }
  location = /.well-known/jwks.json { proxy_pass http://hiveid:3140; }

  location = /auth/login {
    limit_req zone=auth_login burst=9 nodelay;
    limit_req_status 429;
    proxy_pass http://hiveid:3140;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/(auth|account)/ {
    proxy_pass http://hiveid:3140;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://server:8383;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
  }

  location / {
    try_files $uri $uri/ @server;
  }

  location @server {
    proxy_pass http://server:8383;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
