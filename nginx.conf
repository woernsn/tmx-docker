server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location = /tmx { return 302 /; }
  location ^~ /tmx/ { rewrite ^/tmx/(.*)$ /$1 redirect; }
  location = /pub { return 302 /pub/; }
  location = /manage { return 302 /manage/; }

  location ^~ /pub/ {
    proxy_pass http://pub/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /manage/ {
    proxy_pass http://manager:8081/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /manage;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location ~ ^/auth/(login|complete-first-login|select-provider|refresh|logout|me|me/last-selected-provider|allusers|admin-create-user|admin-reset-password|change-password|remove)$ {
    proxy_pass http://manager:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /socket.io/ {
    proxy_pass http://server:8383;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
  }

  location / {
    try_files $uri $uri/ @server;
  }

  location @server {
    proxy_pass http://server:8383;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
