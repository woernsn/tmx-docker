name: tmx

# Standalone distribution: application images are built and published by the
# repository's GitHub Actions workflow. Both images use the same release tag.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tmx
      POSTGRES_DB: tmx
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U tmx -d tmx']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: [redis-server, --save, '', --appendonly, 'no']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    image: ghcr.io/woernsn/tmx-docker-server:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_NAME: TMX
      APP_MODE: production
      APP_PORT: '8383'
      APP_BASE_URL: ${PUBLIC_ORIGIN:-http://localhost:8080}
      TMX_URL: /tmx/
      CFS_CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      STORAGE_PROVIDER: postgres
      PG_HOST: postgres
      PG_PORT: '5432'
      PG_USER: tmx
      PG_DATABASE: tmx
      PG_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      PERSONS_DISABLED: 'true'
      DECLARATIONS_DISABLED: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "require('net').connect(8383, '127.0.0.1').on('connect', function () { this.end(); }).on('error', function () { process.exit(1); })"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    image: ghcr.io/woernsn/tmx-docker-web:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80'
    configs:
      - source: nginx_config
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/tmx/']
      interval: 10s
      timeout: 5s
      retries: 5

configs:
  nginx_config:
    file: ./nginx.conf

volumes:
  postgres-data:
